<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rei Sakuma Birthday Livestream | MEPHINOMALY</title>

    <script>
        const savedTheme = localStorage.getItem("archive-theme");
        if (savedTheme) {
            document.documentElement.dataset.theme = savedTheme;
        }
    </script>

    <link rel="stylesheet" href="../../../style.css">

    <style>
        .birthday-page {
            max-width: 850px;
            margin: 40px auto;
        }

        .birthday-title {
            text-align: center;
            margin-bottom: 24px;
        }

        .birthday-cover {
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            border-radius: 14px;
            margin-bottom: 30px;
        }

        .birthday-chapter {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .birthday-chapter h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .birthday-chapter .oissu {
            margin: 0;
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="../../../index.html">MEPHINOMALY ☾</a>

            <button class="theme-button" id="theme-toggle" type="button">
                ☾ Dark mode
            </button>
        </div>
    </header>

    <main class="container birthday-page">

        <a class="back-link" href="../../../index.html">← Back to archive</a>

        <div class="birthday-title">
            <h1>Rei Sakuma Birthday Livestream</h1>
            <p>A special birthday story for Rei ♡</p>
        </div>

        <section class="birthday-chapter">
            <h2>Chapter 1</h2>

            <div class="oissu">
                <figure>
                    <img
                        src="../../../images/stories/birthdays/rei2026/rei-birthday-chapter-1.png"
                        alt="Chapter 1 illustration"
                    >
                </figure>

                <p>
                    <b>Rei:</b> Thank you for all your birthday wishes. Being able to share this time with you is the greatest gift I could ask for…♪
                </p>
            </div>
        </section>

    </main>

    <script src="../../../main.js"></script>
    <script src="../../../page-transition.js"></script>

    <script>
        const themeToggle = document.getElementById("theme-toggle");

        function updateThemeButton() {
            const currentTheme = document.documentElement.dataset.theme || "light";

            themeToggle.textContent = currentTheme === "dark"
                ? "☀ Light mode"
                : "☾ Dark mode";
        }

        updateThemeButton();

        themeToggle.addEventListener("click", () => {
            const currentTheme = document.documentElement.dataset.theme || "light";
            const newTheme = currentTheme === "dark" ? "light" : "dark";

            document.documentElement.dataset.theme = newTheme;
            localStorage.setItem("archive-theme", newTheme);

            updateThemeButton();
        });
    </script>

</body>
</html>
