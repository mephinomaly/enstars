<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSYCHOBREAK — Chapter 4 | Flashback</title>

    <script>
        const savedTheme = localStorage.getItem("archive-theme");
        if (savedTheme) {
            document.documentElement.dataset.theme = savedTheme;
        }
    </script>

    <link rel="stylesheet" href="../../../style.css">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="../../../index.html">MEPHINOMALY ☾</a>
            <button class="theme-button" id="theme-toggle" type="button">
                ☾ Dark mode
            </button>
        </div>
    </header>

    <main class="container">
        <article class="chapter-page">
            <a class="back-link" href="index.html">← Back to directory</a>

            <h1>PSYCHOBREAK — Chapter 4</h1>

            <div class="chapter-characters">
            
                     <img src="../../../images/characters/undead/koga.png" alt="Koga Oogami">
         
                      <img src="../../../images/characters/undead/adonis.png" alt="Adonis Otogari">
              
              
             
            </div>

            <div class="oissu">
                <figure>
    <img src="../../../images/stories/event/flashback/psychobreak401.png" alt="Flashback PSYCHOBREAK Chapter 4">
</figure>

            </div>
       

            <nav class="chapter-navigation">
                <a class="back-link" href="psychobreak-3.html">← Previous chapter</a>
                <a class="back-link" href="psychobreak-5.html">Next chapter →</a>
            </nav>
        </article>
    </main>

    <script src="../../../main.js"></script>
    <script src="../../../page-transition.js"></script>

    <script>
        const themeToggle = document.getElementById("theme-toggle");

        function updateThemeButton() {
            const isDark = document.documentElement.dataset.theme === "dark";
            themeToggle.textContent = isDark ? "☀ Light mode" : "☾ Dark mode";
        }

        themeToggle.addEventListener("click", () => {
            const isDark = document.documentElement.dataset.theme === "dark";
            const newTheme = isDark ? "light" : "dark";

            document.documentElement.dataset.theme = newTheme;
            localStorage.setItem("archive-theme", newTheme);
            updateThemeButton();
        });

        updateThemeButton();
    </script>
</body>
</html>
