<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backdoor | MEPHINOMALY</title>

    <script>
        const savedTheme = localStorage.getItem("archive-theme");
        if (savedTheme) {
            document.documentElement.dataset.theme = savedTheme;
        }
    </script>

    <link rel="stylesheet" href="../../../style.css">
</head>

<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="../../../index.html">MEPHINOMALY ☾</a>
            <button class="theme-button" id="theme-toggle" type="button">
                ☾ Dark mode
            </button>
        </div>
    </header>

    <main class="container">
        <article class="prose-story-page">

            <a class="back-link" href="../../../index.html">
                ← Back to archive
            </a>

            <header class="prose-story-header">
                <h1>Backdoor</h1>
                <p class="prose-story-credit">
                    An Original Scenario written by Akira
                </p>
            </header>

            <div class="prose-story-content">
                <!-- Story text will go here -->
            </div>

            <a class="back-link" href="../../../index.html">
                ← Back to archive
            </a>

        </article>
    </main>

    <script src="../../../page-transition.js"></script>

    <script>
        const themeToggle = document.getElementById("theme-toggle");

        function updateThemeButton() {
            const currentTheme = document.documentElement.dataset.theme || "light";
            themeToggle.textContent = currentTheme === "dark"
                ? "☀ Light mode"
                : "☾ Dark mode";
        }

        updateThemeButton();

        themeToggle.addEventListener("click", () => {
            const currentTheme = document.documentElement.dataset.theme || "light";
            const newTheme = currentTheme === "dark" ? "light" : "dark";

            document.documentElement.dataset.theme = newTheme;
            localStorage.setItem("archive-theme", newTheme);

            updateThemeButton();
        });
    </script>

</body>
</html>
