<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People and Fish | Idol Story</title>

    <script>
        const savedTheme = localStorage.getItem("archive-theme");
        if (savedTheme) {
            document.documentElement.dataset.theme = savedTheme;
        }
    </script>

    <link rel="stylesheet" href="../../../style.css">
</head>

<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="../../../index.html">MEPHINOMALY ☾</a>
            <button class="theme-button" id="theme-toggle" type="button">
                ☾ Dark mode
            </button>
        </div>
    </header>

    <main class="container">
        <article class="chapter-page">
            <a class="back-link" href="../../../index.html">← Back to archive</a>

            <div class="confession-header">
                <div class="confession-title">
                    <h1>People and Fish</h1>
                    <p>Idol Story</p>
                </div>

                <img
                    class="confession-card-art"
                    src="../../../images/stories/idol-stories/people-and-fish/kanatapeople.png"
                    alt="People and Fish card illustration"
                >
            </div>

            <div class="chapter-characters">
                <img src="../../../images/characters/ryuseitai/kanata.png" alt="Kanata Shinkai">
                <img src="../../../images/characters/akatsuki/souma.png" alt="Souma Kanzaki">
                <img src="../../../images/characters/undead/kaoru.png" alt="Kaoru Hakaze">
            </div>

            <div class="oissu">
                <!-- Translation goes here -->
            </div>
        </article>
    </main>

    <script src="../../../main.js"></script>
    <script src="../../../page-transition.js"></script>

    <script>
        const themeButton = document.getElementById("theme-toggle");

        function updateThemeButton() {
            const isDark =
                document.documentElement.dataset.theme === "dark";

            themeButton.textContent = isDark
                ? "☀ Light mode"
                : "☾ Dark mode";
        }

        themeButton.addEventListener("click", () => {
            const isDark =
                document.documentElement.dataset.theme === "dark";

            const nextTheme = isDark ? "light" : "dark";

            document.documentElement.dataset.theme = nextTheme;
            localStorage.setItem("archive-theme", nextTheme);

            updateThemeButton();
        });

        updateThemeButton();
    </script>
</body>
</html>
